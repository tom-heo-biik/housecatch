# 주제 노드. 브랜드 문서와 주제 안내(context/plan.md)를 시스템 프롬프트로 받고, 이미 있는 주제 목록을 요청으로 받아
# 새 주제를 JSON으로 냅니다(tools/plan.py). 겹침과 금지 문자열은 코드가 다시 거르고, 모자란 만큼 거른 까닭을 붙여 다시 묻습니다.

[node]
name = "plan"
model = "claude-opus-5-5"
effort = "max"              # Tom 선호(노드는 max). 주제 몇 줄이라 초안보다 일찍 끝남
timeout_sec = 1800
stall_sec = 600              # 흘려 받는 이벤트가 10분 동안 없으면 멈춘 것으로 봄
max_budget_usd = 3.0
retries = 0                  # 다시 묻기는 tools/plan.py가 거른 결과를 붙여 직접 합니다(ATTEMPTS)
include = [
  "brand",
  "context/plan.md",
]
