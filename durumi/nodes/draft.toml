# 초안 노드. include는 적힌 순서대로 이어 붙여 시스템 프롬프트 한 파일이 됩니다.
# 브랜드 문서를 앞뒤로 두 번 싣는 것은 크레인 autopilot Phase 1의 설계(마지막에 한 번 더 로드)를 따릅니다.

[node]
name = "draft"
model = "claude-opus-5-5"
effort = "max"              # Tom 선호(크레인 설정과 같음). 초안 하나에 15분을 넘길 수 있어 제한을 한 시간으로 둠
timeout_sec = 3600
stall_sec = 600              # 흘려 받는 이벤트가 10분 동안 없으면 멈춘 것으로 봄
max_budget_usd = 5.0
retries = 2
include = [
  "brand",
  "context/blog.md",
  "context/writing.md",
  "context/naverblog.md",
  "context/form.md",
  "generated:syntax",
  "generated:palettes",
  "brand",
]
